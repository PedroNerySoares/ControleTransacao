services:
  backend:
    build:
      context: ./challenger
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./challenger:/app
      - backend_transacao:/root/.m2
    ports:
      - "8080:8080"
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DATASOURCE_URL: jdbc:sqlserver://sqlserver:1433;databaseName=MeuBanco;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_MAIL_USERNAME: ${EMAIL_USER}
      SPRING_MAIL_PASSWORD: ${EMAIL_PASS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    networks:
      - dev_shared

  frontend:
    build:
      context: ./frontEnd
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./frontEnd:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      API_BASE_URL: http://backend:8080 
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      
  
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    networks:
      - dev_shared

networks:
  dev_shared:
    external: true

volumes:
  backend_transacao:
  frontend_node_modules: